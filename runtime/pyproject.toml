[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fundsentinel-runtime"
version = "0.1.0"
description = "AgentCore Runtime for the FundSentinel pipeline"
requires-python = ">=3.12"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "boto3",
    "pandas",
    "pydantic >= 2",
    "strands-agents >= 1.57.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
